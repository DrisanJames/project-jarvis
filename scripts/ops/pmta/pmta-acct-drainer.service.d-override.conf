# /etc/systemd/system/pmta-acct-drainer.service.d/override.conf
# Drop-in only — the on-box pmta-acct-drainer.service unit is NOT replaced
# (verified Server A 2026-09-21: Type=oneshot User=root Nice=10
# TimeoutStartSec=240 ExecStart=/usr/local/bin/pmta-acct-drainer, no lock).
# The timer (OnUnitActiveSec=30) is NOT touched.
# Overlap guard: the drainer v2 itself takes an exclusive flock on
# /run/lock/pmta-acct-drainer.lock and exits 0 when another run holds it, and
# systemd never starts a second instance of a oneshot that is still
# activating (an OnUnitActiveSec trigger during a run is coalesced). This
# drop-in adds the third guard: a wall-clock cap so a wedged
# run can never hold the unit "activating" forever (which would stop the
# timer from ever refiring). The script's own budget is DRAIN_MAX_RUN_SECONDS
# (default 240 s); systemd kills at 600 s (was 240 s = equal to the script
# budget, which would have raced the script's own clean stop).
[Service]
TimeoutStartSec=600
Environment=DRAIN_MAX_FILES=700
Environment=DRAIN_MERGE_RECORDS=500
Environment=DRAIN_WORKERS=8
Environment=DRAIN_POST_TIMEOUT=20
Environment=DRAIN_503_BACKOFF=5
Environment=DRAIN_MAX_RUN_SECONDS=240
